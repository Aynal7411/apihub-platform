services:
  postgres:
    image: postgres:17-alpine
    container_name: apihub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apihub_db
      POSTGRES_USER: apihub_user
      POSTGRES_PASSWORD: ApiHub@2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apihub_user -d apihub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apihub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: